<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeighborNest — find your people in a new city. Small curated groups (Nests) with local Anchors." />
    <meta name="theme-color" content="#0a0f1c" />

    <!-- Social / share preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NeighborNest — find your people in a new city" />
    <meta property="og:description" content="Small curated groups (Nests) with local Anchors. Real friendships, zero awkward networking." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeighborNest" />
    <meta name="twitter:description" content="Find your people in a new city — matched into small curated Nests with local Anchors." />

    <!-- Boot dark-first before first paint (avoids white flash / FOUC) -->
    <script>
      document.documentElement.classList.add('dark');
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>

    <!-- Fonts: loaded non-blocking (media=print swap trick) so the app shell
         paints immediately even if Google Fonts is slow or unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>NeighborNest</title>

    <!-- Inline branded splash: paints instantly, replaced by the app on mount -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-splash.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #app-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      #app-splash .splash-logo {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #0284c7, #0ea5e9 50%, #38bdf8);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 3px rgba(14,165,233,0.18), 0 8px 32px rgba(14,165,233,0.35);
        animation: splash-breathe 2s ease-in-out infinite;
      }
      #app-splash .splash-logo svg { width: 32px; height: 32px; }
      #app-splash .splash-name {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #f8fafc;
      }
      #app-splash .splash-bar {
        width: 180px;
        height: 3px;
        border-radius: 99px;
        background: rgba(148, 163, 184, 0.15);
        overflow: hidden;
      }
      #app-splash .splash-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.06); }
      }
      @keyframes splash-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body class="bg-void">
    <div id="root"></div>

    <!-- Branded splash shown until React mounts -->
    <div id="app-splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="#ffffff" stroke="none" />
          </svg>
        </div>
        <div class="splash-name">NeighborNest</div>
        <div class="splash-bar"><i></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
