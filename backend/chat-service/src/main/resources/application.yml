server:
  port: 8085

spring:
  application:
    name: chat-service
  datasource:
    # Local/dev defaults only — the docker-compose service overrides MYSQL_HOST
    # with the mysql-chat container name. Port 3311 avoids the host 3310 that
    # mysql-auth already occupies.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3311}/${DB_NAME:chat_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    # Local/dev default only — always override with MYSQL_PASSWORD (or backend/.env).
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
  chat:
    stomp:
      # STOMP plugin must be enabled on the RabbitMQ broker (docker-compose
      # enables rabbitmq_stomp and exposes 61613).
      relay-host: ${STOMP_RELAY_HOST:localhost}
      relay-port: ${STOMP_RELAY_PORT:61613}
      client-login: ${RABBITMQ_USER:guest}
      client-passcode: ${RABBITMQ_PASSWORD:guest}
      system-login: ${RABBITMQ_USER:guest}
      system-passcode: ${RABBITMQ_PASSWORD:guest}
    events:
      # Nest lifecycle events published on the nest.events topic exchange by the
      # nest-service; chat-service declares its own durable queues so it can
      # auto-generate SYSTEM messages ("Welcome to ...", "Congratulations ...").
      exchange: nest.events
      created-routing-key: nest.created
      graduated-routing-key: nest.graduated
      created-queue: chat.nest.created.queue
      graduated-queue: chat.nest.graduated.queue
      # Published after every persisted message so the notification-service can
      # create per-recipient in-app notifications (DM + group fan-out).
      chat-routing-key: chat.message.sent

# Generous Feign timeouts: Spring Cloud OpenFeign's circuit breaker applies a
# 1s TimeLimiter by default, which kills legitimate cold-start calls (first
# Hibernate bootstrap, JIT warm-up) to sibling services. Applies to every
# Feign client instance in this service.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 20s
        cancel-running-future: true

logging:
  level:
    com.neighbornest.chatservice: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.messaging: WARN
    org.hibernate.SQL: WARN
