spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: VGVzdFNlY3JldEtleUZvck5laWdoYm9yTmVzdFRlc3RpbmdQdXJwb3Nlc09ubHkxMjM0NQ==
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
