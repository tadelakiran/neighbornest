server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # Single shared local MySQL (host port 3306) like every other service — see
    # README.md and scripts/setup_local_mysql.sql. When auth-service runs in
    # Docker, the compose file overrides this with SPRING_DATASOURCE_URL.
    # createDatabaseIfNotExist lets the service create its own schema on first
    # boot, so a forgotten manual DB setup can't silently take the service down
    # (which surfaces to clients as a gateway "service unavailable" fallback).
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:neighbornest_auth}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    # Local/dev default only — always override with MYSQL_PASSWORD (or backend/.env)
    # in real environments. Never hardcode real credentials in source control.
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.batch_size: 20
        order_inserts: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}       # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  # Shared secret for the notification-service's internal email endpoints.
  # Must match INTERNAL_API_KEY configured in the notification-service.
  internal:
    api-key: ${INTERNAL_API_KEY:}

# Explicit Feign timeouts for calls to the notification-service (OTP send/
# verify, welcome email). Bounded so a slow/hung email service can never make
# the auth flow hang for a full minute (Feign's default read timeout is 60s),
# while still generous enough for a cold JVM / first Hibernate bootstrap.
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 20000

logging:
  level:
    com.neighbornest.auth: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
