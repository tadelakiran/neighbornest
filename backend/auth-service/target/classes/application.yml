server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # Host port 3310 matches docker-compose's mysql-auth mapping (3306 on the
    # host is usually a local MySQL). When auth-service runs in Docker, the
    # compose file overrides this with SPRING_DATASOURCE_URL=mysql-auth:3306.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3310}/${DB_NAME:neighbornest_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    # Local/dev default only — always override with MYSQL_PASSWORD (or backend/.env)
    # in real environments. Never hardcode real credentials in source control.
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.batch_size: 20
        order_inserts: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}       # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  # Shared secret for the notification-service's internal email endpoints.
  # Must match INTERNAL_API_KEY configured in the notification-service.
  internal:
    api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.neighbornest.auth: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
