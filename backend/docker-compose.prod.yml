# ============================================================================
# NeighborNest — Production overlay (free Oracle Cloud VM deployment)
# ============================================================================
#
# Run together with the base compose file:
#
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     up -d --build
#
# What this overlay changes vs. the dev compose:
#   * Adds a containerized MySQL (the dev compose uses the host's MySQL).
#   * Adds Caddy: automatic HTTPS (Let's Encrypt) in front of the API Gateway,
#     so the Vercel-hosted frontend can call the API over HTTPS (browsers
#     block HTTP requests from HTTPS pages — mixed content).
#   * Points every service's datasource at the `mysql` container.
#   * Constrains each JVM (Xmx/metaspace) so 8 Spring Boot services + MySQL +
#     RabbitMQ fit comfortably inside the Always Free ARM VM (~12-24 GB RAM).
#   * Adds restart policies so the stack survives VM reboots. (Loopback-only
#     port bindings live in the base compose; only Caddy's 80/443 are public.)
#
# Required variables (set in .env.prod, git-ignored — see deploy/.env.prod.example):
#   API_DOMAIN            DuckDNS subdomain for the API (Caddy HTTPS cert)
#   MYSQL_PASSWORD        Root password for the MySQL container (all services log in as root)
#   JWT_SECRET            Base64 secret shared by all services (openssl rand -base64 64)
#   INTERNAL_API_KEY      Shared secret for auth-service <-> notification-service calls
#   CORS_ALLOWED_ORIGINS  Comma-separated frontend origins (the Vercel app URL)
#   NOTIFICATION_BASE_URL Frontend URL used in email deep links
#
# See docs/DEPLOYMENT_FREE_CLOUD.md for the full step-by-step guide.

name: neighbornest-prod

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------

  mysql:
    image: mysql:8.0
    container_name: neighbornest-mysql
    restart: unless-stopped
    # Small buffer pool is plenty for this workload and keeps RAM low.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      # Allow the app containers (which connect as root from other hosts on the
      # docker network) to authenticate. The official image creates root@'%'
      # only when this is set.
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the six service databases on first boot (tables are created by
      # each service's own Hibernate ddl-auto=update).
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  rabbitmq:
    restart: unless-stopped

  eureka-service:
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:MaxMetaspaceSize=192m"

  # --------------------------------------------------------------------------
  # Domain services — datasources point at the MySQL container, JVMs are
  # memory-constrained, ports are loopback-only, and everything restarts.
  # --------------------------------------------------------------------------

  auth-service:
    restart: unless-stopped
    environment:
      # SPRING_DATASOURCE_URL wins over the MYSQL_HOST/MYSQL_PORT bindings.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/neighbornest_auth?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    depends_on:
      mysql:
        condition: service_healthy

  user-service:
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    depends_on:
      mysql:
        condition: service_healthy

  matching-service:
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    depends_on:
      mysql:
        condition: service_healthy

  nest-service:
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    depends_on:
      mysql:
        condition: service_healthy

  chat-service:
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
      # Email deep links must point at the deployed frontend, not localhost.
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL}
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m"
      # Allow the deployed frontend (Vercel) to call the API from the browser.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  # --------------------------------------------------------------------------
  # Caddy — free HTTPS (Let's Encrypt) for the API + WebSocket endpoint
  # --------------------------------------------------------------------------

  caddy:
    image: caddy:2-alpine
    container_name: neighbornest-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-gateway

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
