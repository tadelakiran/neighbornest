# ==============================================================================
# NeighborNest — Render Blueprints (render.yaml)
# ==============================================================================
# Deploy all 8 microservices on Render Free Tier (512MB per service).
#
# IMPORTANT: This is a BLUEPRINT spec. You must:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint" → connect your GitHub repo
#   4. Render will auto-detect this render.yaml and create all services
#   5. Manually set environment variables (see deploy/render/README.md)
#
# EXTERNAL SERVICES REQUIRED (free tiers available):
#   - MySQL: PlanetScale free tier, or Supabase free tier, or Railway MySQL
#   - RabbitMQ: CloudAMQP free tier ("Little Lemur" plan)
#
# LIMITATIONS OF RENDER FREE TIER:
#   - 512MB RAM per service
#   - Services spin down after 15 min of inactivity
#   - Cold start takes 30-60 seconds
#   - No persistent disk (MySQL/RabbitMQ MUST be external)
#   - Public URLs: *.onrender.com
# ==============================================================================

services:
  # ── Eureka Service Discovery ────────────────────────────────────────────────
  - type: web
    name: eureka-service
    runtime: docker
    dockerfilePath: backend/eureka-service/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx200m -Xms128m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        sync: false
        # Set to: http://eureka-service.onrender.com/eureka/
      - key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "true"

  # ── Auth Service ────────────────────────────────────────────────────────────
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: backend/auth-service/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -Xms192m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
      - key: SERVER_PORT
        value: "8081"
      - key: EUREKA_SERVER_URL
        sync: false
        # Set to: http://eureka-service.onrender.com/eureka/
      - key: SPRING_DATASOURCE_URL
        sync: false
        # Set to: jdbc:mysql://your-mysql-host:3306/neighbornest_auth?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  # ── User Service ────────────────────────────────────────────────────────────
  - type: web
    name: user-service
    runtime: docker
    dockerfilePath: backend/user-service/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
