      - key: SERVER_PORT
        value: "8083"
      - key: EUREKA_SERVER_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: DB_NAME
        value: "matching_db"
      - key: JWT_SECRET
