      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -Xms192m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
      - key: SERVER_PORT
        value: "8082"
      - key: EUREKA_SERVER_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: DB_NAME
        value: "user_db"
      - key: JWT_SECRET
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        sync: false
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  # ── Matching Service ────────────────────────────────────────────────────────
