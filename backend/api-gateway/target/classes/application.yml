server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user

        - id: matching-service
          uri: lb://MATCHING-SERVICE
          predicates:
            - Path=/api/matching/**
          filters:
            - name: CircuitBreaker
              args:
                name: matchingServiceCircuitBreaker
                fallbackUri: forward:/fallback/matching

        - id: nest-service
          uri: lb://NEST-SERVICE
          predicates:
            - Path=/api/nests/**
          filters:
            - name: CircuitBreaker
              args:
                name: nestServiceCircuitBreaker
                fallbackUri: forward:/fallback/nest

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# JWT configuration shared with all services
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}

logging:
  level:
    com.neighbornest.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
