<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settle up</title>
</head>
<body style="margin:0; padding:0; background:#0a0f1c; font-family: Inter, -apple-system, 'Segoe UI', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0f1c;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px; width:100%; background:#111a2e; border-radius:16px; border:1px solid #1e293b; overflow:hidden;">
                <tr>
                    <td style="padding:36px 40px 8px;">
                        <div style="font-size:13px; letter-spacing:3px; color:#38bdf8; font-weight:700;">NEIGHBORNEST</div>
                        <h1 style="margin:14px 0 0; font-size:28px; line-height:1.25; color:#f8fafc; font-weight:700;">
                            Settle up: <span th:text="${description}">Group dinner</span></h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 40px 8px;">
                        <p style="margin:0 0 14px; font-size:16px; line-height:1.7; color:#cbd5e1;">
                            Hi <span th:text="${userName}">Jane</span>,</p>
                        <p style="margin:0 0 20px; font-size:16px; line-height:1.7; color:#cbd5e1;">
                            You have an outstanding share for
                            <strong style="color:#f8fafc;" th:text="${description}">Group dinner</strong>
                            in <strong style="color:#f8fafc;" th:text="${nestName}">Mission Mates</strong>:</p>
                        <div style="background:#0a0f1c; border:1px solid #1e293b; border-radius:12px; padding:20px 24px;">
                            <div style="font-size:13px; letter-spacing:2px; color:#64748b; text-transform:uppercase;">Amount owed</div>
                            <div style="font-size:32px; font-weight:700; color:#38bdf8; margin-top:4px;"
                                 th:text="${amount}">$25.00</div>
                        </div>
                        <p style="margin:24px 0 28px;">
                            <a th:href="${nestLink}" style="display:inline-block; background:#0ea5e9; color:#ffffff; padding:14px 30px; border-radius:8px; text-decoration:none; font-weight:600; font-size:15px;">
                                Settle up</a>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px 40px 32px; border-top:1px solid #1e293b;">
                        <p style="margin:0; font-size:13px; line-height:1.6; color:#64748b;">
                            You're receiving this because a Nest expense is awaiting your share. Keep the books friendly!</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
