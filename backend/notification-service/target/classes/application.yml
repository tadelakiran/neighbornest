server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    # Local/dev defaults only — the docker-compose service overrides MYSQL_HOST
    # with the mysql-notification container name. Port 3312 avoids the host
    # ports already taken by the other databases (3310 auth, 3307 user,
    # 3308 matching, 3309 nest, 3311 chat).
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3312}/${DB_NAME:notification_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    # Local/dev default only — always override with MYSQL_PASSWORD (or backend/.env).
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  thymeleaf:
    cache: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
  # One-time passcode (email verification / password reset) policy.
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    resend-after-seconds: ${OTP_RESEND_AFTER_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  # Shared secret for service-to-service endpoints (/api/notifications/internal/**).
  # Must match the value configured in the auth-service. Fails closed when empty.
  internal:
    api-key: ${INTERNAL_API_KEY:}
  notification:
    # Base URL used to build deep links in emails (the API gateway in prod).
    base-url: ${NOTIFICATION_BASE_URL:http://localhost:8080}
    events:
      # Nest lifecycle events published on the nest.events topic exchange by the
      # nest-service. The chat queue is wired for future chat offline-push
      # events (chat-service does not publish them yet).
      exchange: nest.events
      created-queue: notification.nest.created
      graduated-queue: notification.nest.graduated
      disbanded-queue: notification.nest.disbanded
      chat-queue: notification.chat.message
      anchor-queue: notification.user.anchor.reviewed
      created-routing-key: nest.created
      graduated-routing-key: nest.graduated
      disbanded-routing-key: nest.disbanded
      chat-routing-key: chat.message.sent
      anchor-routing-key: user.anchor.reviewed

# Email delivery via EmailJS (https://www.emailjs.com) — templates are defined
# in the EmailJS dashboard, not in this repository. The template keys below
# must match the EmailJS template ids you create there. Set the Subject field
# of each template to {{subject}} and the To Email field to {{to_email}}.
emailjs:
  public-key: ${EMAILJS_PUBLIC_KEY:ZgCz14aXMuiPcMgHp}
  private-key: ${EMAILJS_PRIVATE_KEY:0F-beqBI2TQuefr07BHDQ}
  service-id: ${EMAILJS_SERVICE_ID:service_4vc38of}
  templates:
    otp-verification: ${EMAILJS_TEMPLATE_OTP_VERIFICATION:template_oz4a8gc}
    password-reset: ${EMAILJS_TEMPLATE_PASSWORD_RESET:template_tfu0p8c}
    welcome: ${EMAILJS_TEMPLATE_WELCOME:}
    nest-welcome: ${EMAILJS_TEMPLATE_NEST_WELCOME:}
    nest-graduate: ${EMAILJS_TEMPLATE_NEST_GRADUATE:}
    nest-disbanded: ${EMAILJS_TEMPLATE_NEST_DISBANDED:}
    meeting-reminder: ${EMAILJS_TEMPLATE_MEETING_REMINDER:}
    expense-alert: ${EMAILJS_TEMPLATE_EXPENSE_ALERT:}
    vibe-check-reminder: ${EMAILJS_TEMPLATE_VIBE_CHECK_REMINDER:}
    chat-offline: ${EMAILJS_TEMPLATE_CHAT_OFFLINE:}
    raw-email: ${EMAILJS_TEMPLATE_RAW_EMAIL:}

# Generous Feign timeouts: Spring Cloud OpenFeign's circuit breaker applies a
# 1s TimeLimiter by default, which kills legitimate cold-start calls (first
# Hibernate bootstrap, JIT warm-up) to sibling services.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 20s
        cancel-running-future: true

logging:
  level:
    com.neighbornest.notificationservice: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN
