services:
  # ============================================================
  # Infrastructure: Message Broker, Service Discovery
  # ============================================================
  #
  # NOTE ON DATABASES: NeighborNest deliberately does NOT run MySQL in Docker.
  # All services share the developer's local MySQL instance on the host
  # (localhost:3306) so data is easy to inspect with any SQL client / IDE.
  # Containers reach it via `host.docker.internal`. See backend/scripts/
  # setup_local_mysql.sql — run it once to create the six databases and the
  # `neighbornest` user the containers authenticate as.

  rabbitmq:
    image: rabbitmq:3-management
    container_name: neighbornest-rabbitmq
    # All ports bind to loopback only — safer on shared networks, and every
    # client (browser, IDE, the app containers themselves) reaches these via
    # localhost / the docker network anyway. In production the API is exposed
    # publicly only through Caddy on 80/443.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      # STOMP plugin port used by the chat-service STOMP broker relay.
      - "127.0.0.1:61613:61613"
    # Enable the STOMP plugin at startup (it is not enabled by default on the
    # management image). --offline avoids needing a running broker.
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-neighbornest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-service:
    build:
      context: .
      dockerfile: eureka-service/Dockerfile
    container_name: neighbornest-eureka
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ============================================================
  # Domain Services
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: neighbornest-auth
    ports:
      - "127.0.0.1:8081:8081"
    # Healthcheck: actuator health only reports UP once the DB connection works.
    # start_period covers the long cold boot (JVM + first Hikari pool + JPA
    # schema update) so a slow start does not count as a failed health probe.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      # Single shared local MySQL (host port 3306). SPRING_DATASOURCE_URL
      # wins over the relaxed MYSQL_HOST/MYSQL_PORT/DB_NAME bindings.
      # createDatabaseIfNotExist so a missing manual DB setup can't silently
      # take auth-service down (which surfaces as a gateway "service
      # unavailable" fallback on every /api/auth/** request).
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/neighbornest_auth?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-neighbornest}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      # Shared secret for calling the notification-service email endpoints.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-neighbornest-internal-dev-key}
    depends_on:
      eureka-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: neighbornest-user
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neighbornest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_NAME: user_db
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-neighbornest}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_started

  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    container_name: neighbornest-matching
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neighbornest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_NAME: matching_db
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-neighbornest}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_started

  nest-service:
    build:
      context: .
      dockerfile: nest-service/Dockerfile
    container_name: neighbornest-nest
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neighbornest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_NAME: nest_db
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-neighbornest}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_started

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: neighbornest-chat
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neighbornest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_NAME: chat_db
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-neighbornest}
      # STOMP relay points at the same RabbitMQ (STOMP plugin on 61613).
      STOMP_RELAY_HOST: rabbitmq
      STOMP_RELAY_PORT: 61613
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: neighbornest-notification
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-neighbornest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_NAME: notification_db
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-neighbornest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-neighbornest}
      # EmailJS REST API delivery. Templates are managed in the EmailJS
      # dashboard; the template-id mapping lives in application.yml and can be
      # overridden with EMAILJS_TEMPLATE_* vars here as needed.
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-ZgCz14aXMuiPcMgHp}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-0F-beqBI2TQuefr07BHDQ}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-service_4vc38of}
      EMAILJS_TEMPLATE_OTP_VERIFICATION: ${EMAILJS_TEMPLATE_OTP_VERIFICATION:-template_oz4a8gc}
      EMAILJS_TEMPLATE_PASSWORD_RESET: ${EMAILJS_TEMPLATE_PASSWORD_RESET:-template_tfu0p8c}
      EMAILJS_TEMPLATE_WELCOME: ${EMAILJS_TEMPLATE_WELCOME:-}
      EMAILJS_TEMPLATE_NEST_WELCOME: ${EMAILJS_TEMPLATE_NEST_WELCOME:-}
      EMAILJS_TEMPLATE_NEST_GRADUATE: ${EMAILJS_TEMPLATE_NEST_GRADUATE:-}
      EMAILJS_TEMPLATE_NEST_DISBANDED: ${EMAILJS_TEMPLATE_NEST_DISBANDED:-}
      EMAILJS_TEMPLATE_MEETING_REMINDER: ${EMAILJS_TEMPLATE_MEETING_REMINDER:-}
      EMAILJS_TEMPLATE_EXPENSE_ALERT: ${EMAILJS_TEMPLATE_EXPENSE_ALERT:-}
      EMAILJS_TEMPLATE_VIBE_CHECK_REMINDER: ${EMAILJS_TEMPLATE_VIBE_CHECK_REMINDER:-}
      EMAILJS_TEMPLATE_CHAT_OFFLINE: ${EMAILJS_TEMPLATE_CHAT_OFFLINE:-}
      EMAILJS_TEMPLATE_RAW_EMAIL: ${EMAILJS_TEMPLATE_RAW_EMAIL:-}
      # Shared secret for the internal email endpoints (must match auth-service).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-neighbornest-internal-dev-key}
      # Base URL for email deep links (points at the frontend in dev).
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-http://localhost:5173}
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: neighbornest-gateway
    ports:
      - "127.0.0.1:8080:8080"
    # The gateway is the front door: only start it once every routed service is
    # healthy (actuator UP = DB connected). Otherwise the first minutes after
    # `docker compose up` hit the circuit-breaker fallback and users see
    # "X-service is temporarily unavailable" even though nothing is wrong.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIE5laWdoYm9yTmVzdCBKV1QgdG9rZW4gc2lnbmluZyAtIGRldmVsb3BtZW50IG9ubHk=}
      EUREKA_SERVER_URL: http://eureka-service:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    depends_on:
      eureka-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      nest-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
